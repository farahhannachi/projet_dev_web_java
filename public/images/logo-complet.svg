<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Fond blanc circulaire -->
  <circle cx="200" cy="200" r="195" fill="#f5f5f5"/>
  
  <!-- Croix verte avec dégradé -->
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ed957;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5cb85c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cercle décoratif arrière-plan -->
  <circle cx="200" cy="150" r="85" fill="none" stroke="#5cb85c" stroke-width="3" opacity="0.2"/>
  
  <!-- Croix principale -->
  <rect x="175" y="90" width="50" height="120" fill="url(#greenGradient)" rx="5"/>
  <rect x="140" y="125" width="120" height="50" fill="url(#greenGradient)" rx="5"/>
  
  <!-- Contour de la croix (gris foncé) -->
  <rect x="175" y="90" width="50" height="120" fill="none" stroke="#4a5568" stroke-width="4" rx="5"/>
  <rect x="140" y="125" width="120" height="50" fill="none" stroke="#4a5568" stroke-width="4" rx="5"/>
  
  <!-- Feuilles décoratives gauche -->
  <ellipse cx="160" cy="110" rx="8" ry="12" fill="#7ed957" transform="rotate(-30 160 110)"/>
  <ellipse cx="170" cy="100" rx="8" ry="12" fill="#7ed957" transform="rotate(-20 170 100)"/>
  <ellipse cx="180" cy="95" rx="8" ry="12" fill="#7ed957" transform="rotate(-10 180 95)"/>
  
  <!-- Feuilles décoratives droite -->
  <ellipse cx="240" cy="110" rx="8" ry="12" fill="#7ed957" transform="rotate(30 240 110)"/>
  <ellipse cx="230" cy="100" rx="8" ry="12" fill="#7ed957" transform="rotate(20 230 100)"/>
  <ellipse cx="220" cy="95" rx="8" ry="12" fill="#7ed957" transform="rotate(10 220 95)"/>
  
  <!-- Feuilles décoratives bas -->
  <ellipse cx="240" cy="190" rx="8" ry="12" fill="#7ed957" transform="rotate(30 240 190)"/>
  <ellipse cx="250" cy="180" rx="8" ry="12" fill="#7ed957" transform="rotate(40 250 180)"/>
  
  <!-- Arc décoratif -->
  <path d="M 150 150 Q 200 120 250 150" fill="none" stroke="#4a5568" stroke-width="3" opacity="0.3"/>
  
  <!-- Texte CURAVITA -->
  <text x="200" y="280" font-family="Georgia, serif" font-size="52" font-weight="400" text-anchor="middle" fill="#4a5568" letter-spacing="8">
    CURAVITA
  </text>
</svg>
