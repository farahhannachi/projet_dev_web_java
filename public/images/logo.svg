<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Croix verte avec dégradé -->
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ed957;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5cb85c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Croix principale -->
  <rect x="75" y="40" width="50" height="120" fill="url(#greenGradient)" rx="5"/>
  <rect x="40" y="75" width="120" height="50" fill="url(#greenGradient)" rx="5"/>
  
  <!-- Contour de la croix (gris foncé au lieu de noir) -->
  <rect x="75" y="40" width="50" height="120" fill="none" stroke="#4a5568" stroke-width="4" rx="5"/>
  <rect x="40" y="75" width="120" height="50" fill="none" stroke="#4a5568" stroke-width="4" rx="5"/>
  
  <!-- Feuilles décoratives -->
  <ellipse cx="60" cy="60" rx="8" ry="12" fill="#7ed957" transform="rotate(-30 60 60)"/>
  <ellipse cx="70" cy="50" rx="8" ry="12" fill="#7ed957" transform="rotate(-20 70 50)"/>
  <ellipse cx="80" cy="45" rx="8" ry="12" fill="#7ed957" transform="rotate(-10 80 45)"/>
  
  <ellipse cx="140" cy="60" rx="8" ry="12" fill="#7ed957" transform="rotate(30 140 60)"/>
  <ellipse cx="130" cy="50" rx="8" ry="12" fill="#7ed957" transform="rotate(20 130 50)"/>
  <ellipse cx="120" cy="45" rx="8" ry="12" fill="#7ed957" transform="rotate(10 120 45)"/>
  
  <ellipse cx="140" cy="140" rx="8" ry="12" fill="#7ed957" transform="rotate(30 140 140)"/>
  <ellipse cx="150" cy="130" rx="8" ry="12" fill="#7ed957" transform="rotate(40 150 130)"/>
  
  <!-- Cercle décoratif -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#5cb85c" stroke-width="3" opacity="0.3"/>
</svg>
