<!DOCTYPE html>
<html>
<head>
    <title>Depot Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            height: 450px;
            min-height: 350px;
            width: 100%;
            min-width: 300px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map;
        var marker;

        function initMap() {
            // Initialize map centered on France
            map = L.map('map').setView([46.603354, 1.888334], 6);

            // Add OpenStreetMap tiles
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);

            // Add click handler
            map.on('click', function(e) {
                var lat = e.latlng.lat;
                var lng = e.latlng.lng;

                // Remove existing marker
                if (marker) {
                    map.removeLayer(marker);
                }

                // Add new marker
                marker = L.marker([lat, lng]).addTo(map);

                // Update Java form
                if (window.java && window.java.updateLocation) {
                    window.java.updateLocation(lat, lng, lat.toFixed(5) + ', ' + lng.toFixed(5));
                }
            });
        }

        function setMapCenter(lat, lng) {
            if (map) {
                map.setView([lat, lng], 13);
                // Add marker if coordinates are not default
                if (lat !== 46.603354 || lng !== 1.888334) {
                    if (marker) {
                        map.removeLayer(marker);
                    }
                    marker = L.marker([lat, lng]).addTo(map);
                }
            }
        }

        function addMarker(lat, lng, name) {
            if (marker) {
                map.removeLayer(marker);
            }
            marker = L.marker([lat, lng]).addTo(map).bindPopup(name).openPopup();
        }
        // Initialize map when page loads
        window.onload = initMap;
    </script>
</body>
</html>
